displayName = "VoidFrequency"
description = '''
VoidFrequency: an industrial radio mod. Distributors stream MP3 playlists or live voice, repeaters and
cables carry signals underground, jammers sabotage them, number stations hide the coordinates of
abandoned bunkers and crashed satellites.
Put .mp3 files into config/mc_radio/tracks/ on the machine that hosts the world.
'''

